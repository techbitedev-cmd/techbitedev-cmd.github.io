<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Authorization — TechBite</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
<style>
  .panel { padding-block: 76px 0; max-width: var(--maxw); }
  .panel h1 { font-size: clamp(2rem, 6vw, 2.8rem); }
  .panel > p { margin-top: 18px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 26px; align-items: center; }
  .btn {
    font: inherit; font-weight: 600; text-decoration: none;
    background: var(--lime); color: var(--ink);
    border: 2px solid var(--ink);
    border-radius: 999px; padding: 9px 20px; cursor: pointer;
    display: inline-block;
  }
  .btn:hover { background: var(--ink); color: var(--lime); }
  .err { border-left: 4px solid var(--coral); background: var(--surface); padding: 16px 20px; margin-top: 26px; }
  details { margin-top: 26px; color: var(--text-dim); font-size: 0.92rem; }
  details code { font-family: "IBM Plex Mono", ui-monospace, monospace; word-break: break-all; }
</style>
</head>
<body>

<header class="masthead">
  <div class="wrap">
    <a class="mark" href="index.html"><span class="glyph">TB</span> TechBite</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="privacy.html">Privacy</a>
      <a href="terms.html">Terms</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="panel">
    <p class="eyebrow">TechBite Publisher</p>
    <h1 id="head">Finishing sign-in…</h1>
    <p id="intro">Handing the authorization back to TechBite Publisher on this computer. This page does not store anything.</p>
    <div class="row" id="row" hidden>
      <a class="btn" id="manual" href="#">Continue</a>
    </div>
    <div class="err" id="err" hidden><p id="errtext"></p></div>
    <details id="raw" hidden><summary>Authorization code</summary><p><code id="codeval"></code></p></details>
  </div>
</main>

<footer class="foot">
  <div class="wrap">
    <span>© 2026 TechBite</span>
    <a href="privacy.html">Privacy Policy</a>
    <a href="terms.html">Terms of Service</a>
  </div>
</footer>

<script>
(function () {
  var q = new URLSearchParams(location.search);
  var code = q.get('code');
  var error = q.get('error') || q.get('error_description');
  var target = 'http://127.0.0.1:5690'.replace('5690', '5678') + '/webhook/tiktok-callback' + location.search;

  if (error) {
    document.getElementById('head').textContent = 'Authorization failed';
    document.getElementById('intro').textContent = 'TikTok did not grant access. Nothing was connected.';
    document.getElementById('err').hidden = false;
    document.getElementById('errtext').textContent = error;
    return;
  }

  if (!code) {
    document.getElementById('head').textContent = 'Nothing to finish';
    document.getElementById('intro').textContent = 'Open this page through the TikTok authorization flow — there is no code in the address.';
    return;
  }

  var a = document.getElementById('manual');
  a.href = target;
  document.getElementById('row').hidden = false;
  document.getElementById('codeval').textContent = code;
  document.getElementById('raw').hidden = false;

  setTimeout(function () { location.replace(target); }, 900);
})();
</script>

</body>
</html>
